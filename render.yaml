# Render Blueprint: crea la base de datos PostgreSQL y el servidor web, conectados entre sí.
# En Render: New → Blueprint → elegir este repositorio → Apply.
databases:
  - name: manaco-vision-db
    plan: free            # PostgreSQL gratuito (Render lo da por 30 días; luego pasar a un plan pago)
    databaseName: manaco
    user: manaco

services:
  - type: web
    name: manaco-vision-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/servidor.js
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manaco-vision-db
          property: connectionString
      - key: SECRETO_JWT
        generateValue: true
      - key: CORS_ORIGENES
        value: https://gris999.github.io
      - key: NODE_VERSION
        value: "22.12.0"
